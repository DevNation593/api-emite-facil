# Infraestructura local de desarrollo. Las credenciales vienen de un .env sin versionar
# (ver .env.example). Los puertos se publican solo en 127.0.0.1.
# El almacenamiento de objetos compatible con S3 se añade en el Plan 4 (docs/13-deployment.md).
name: einvoice
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: einvoice
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d einvoice"]
      interval: 10s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set}
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
  # Proveedor OIDC SOLO para desarrollo local: da el inicio de sesión que la API y la aplicación web
  # necesitan. No se arranca salvo que se pida el perfil: docker compose --profile idp ... up -d
  # En producción se usa el proveedor de identidad que se elija, no este.
  keycloak:
    profiles: [idp]
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-}
      # Contraseña del usuario "demo" del reino importado (infra/keycloak/einvoice-realm.json).
      KEYCLOAK_DEMO_PASSWORD: ${KEYCLOAK_DEMO_PASSWORD:-}
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"]
    volumes:
      - ./keycloak/einvoice-realm.json:/opt/keycloak/data/import/einvoice-realm.json:ro
volumes:
  pgdata: {}
