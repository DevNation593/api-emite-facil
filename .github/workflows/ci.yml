name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Incluye las pruebas *IT, que levantan PostgreSQL, RabbitMQ y Redis con Testcontainers, la
      # cobertura mínima de los paquetes críticos (JaCoCo) y el inventario de dependencias (SBOM).
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: backend-sbom
          path: target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: target/site/jacoco
          if-no-files-found: ignore

  # El recorrido completo en un navegador: alta de la empresa, emisión hasta AUTORIZADO contra un SRI
  # simulado, descargas, correo, rechazo y reemisión, equipo, avisos y sesión. Corre el jar de esta
  # API y la compilación de producción de la web, que vive en DevNation593/client-factura-facil
  # (e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_FRONTEND_DIR: ${{ github.workspace }}/client-factura-facil
    steps:
      - uses: actions/checkout@v7
      # La web de la rama del mismo nombre si existe (dev, qa, main o una rama de trabajo compartida);
      # si no, la de la rama de destino del pull request, y si tampoco, la de dev.
      - name: Aplicación web
        env:
          BRANCHES: ${{ github.head_ref || github.ref_name }} ${{ github.base_ref }} dev
        run: |
          for branch in $BRANCHES; do
            if git clone --quiet --depth 1 --branch "$branch" https://github.com/DevNation593/client-factura-facil.git "$E2E_FRONTEND_DIR"; then
              echo "Web de la rama $branch"
              exit 0
            fi
          done
          exit 1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            client-factura-facil/package-lock.json
            e2e/package-lock.json
      - name: Jar de la API
        run: ./mvnw -B -q -DskipTests -Djacoco.skip=true package
      - name: Compilación de la web
        working-directory: client-factura-facil
        run: npm ci && npm run build
      - name: Dependencias y navegador
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Pruebas del SRI simulado y tipos
        working-directory: e2e
        run: npm test && npm run typecheck
      - name: Infraestructura de pruebas
        working-directory: e2e
        run: npm run stack:up
      - name: Pruebas con navegador
        working-directory: e2e
        run: npm run e2e
      # Con las capturas de cada pantalla y, si algo falló, la traza para reproducirlo.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  xsd-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/verify_xsd_assets.py src/main/resources/xsd

  # La imagen se construye para comprobar que sigue construyéndose y que no corre como root.
  # No se publica: el registro de imágenes aún no está elegido (docs/15-produccion.md).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t einvoice-api:ci .
      - name: No corre como root
        run: test "$(docker run --rm --entrypoint id einvoice-api:ci -u)" != "0"
