  /invoices:
    post:
      tags: [invoices]
      operationId: issueInvoice
      security:
        - bearerAuth: []
        - apiKey: []
      summary: >
        Emite una factura: la calcula, le asigna secuencial y clave de acceso y la deja en RESERVED.
        202 significa aceptada para procesamiento, no autorizada por el SRI. Requiere rol OWNER,
        ADMIN o BILLER.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Identifica el intento de emisión (hasta 100 caracteres: letras, dígitos y . _ : -).
            Repetirlo con el mismo cuerpo devuelve el mismo documento; con otro cuerpo responde
            409 IDEMPOTENCY_KEY_REUSED.
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueInvoiceRequest' }
      responses:
        '202':
          description: Factura aceptada y reservada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedDocument' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422':
          description: >
            Regla fiscal incumplida. errorCode: UNSUPPORTED_CURRENCY, INVALID_ISSUE_DATE,
            EMISSION_POINT_DISABLED, INVALID_LINE, AMOUNT_TOO_LARGE, TAX_RATE_UNKNOWN,
            PAYMENT_METHOD_UNKNOWN, INVALID_PAYMENT, INVALID_PAYMENT_TERM (plazo sin unidad o al revés),
            PAYMENTS_MISMATCH,
            FINAL_CONSUMER_LIMIT_EXCEEDED, SEQUENCE_EXHAUSTED o DOCUMENT_XML_INVALID (el XML generado
            no pasó el esquema del SRI; no se consume secuencial).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /credit-notes:
    post:
      tags: [credit-notes]
      operationId: issueCreditNote
      security:
        - bearerAuth: []
        - apiKey: []
      summary: >
        Emite una nota de crédito sobre una factura autorizada de la plataforma (invoiceId) o sobre una
        factura escrita a mano (modifiedDocument con customerId): la calcula como la factura, le asigna
        secuencial y clave de acceso y la deja en RESERVED. 202 significa aceptada para procesamiento, no
        autorizada por el SRI. Requiere rol OWNER, ADMIN o BILLER.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: Idempotency-Key
          in: header
          required: true
          description: >
            Identifica el intento de emisión (hasta 100 caracteres: letras, dígitos y . _ : -).
            Repetirlo con el mismo cuerpo devuelve el mismo documento; con otro cuerpo responde
            409 IDEMPOTENCY_KEY_REUSED.
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCreditNoteRequest' }
      responses:
        '202':
          description: Nota de crédito aceptada y reservada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedDocument' }
        '400':
          description: >
            Petición inválida. errorCode: VALIDATION_FAILED (también si una línea no tiene la forma de su
            caso o repite una línea de la factura), MODIFIED_DOCUMENT_REQUIRED (no viene invoiceId ni
            modifiedDocument con customerId, o vienen los dos, o invoiceId con customerId),
            IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID o MALFORMED_REQUEST.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: >
            El emisor, el punto de emisión, la factura (invoiceId), el cliente o un producto no existen en
            la empresa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422':
          description: >
            Regla fiscal incumplida. errorCode: MODIFIED_DOCUMENT_NOT_INVOICE (invoiceId no es una
            factura), MODIFIED_INVOICE_OTHER_ISSUER (la factura es de otro emisor de la empresa),
            MODIFIED_INVOICE_NOT_AUTHORIZED (la factura no está autorizada), INVALID_MODIFIED_DOCUMENT_DATE
            (la factura es posterior a la nota), CREDIT_LINE_UNKNOWN (la factura no tiene esa línea),
            CREDIT_LINE_EXCEEDS_INVOICE (cantidad o precio unitario mayor que el de la línea original, o
            descuento menor que el original prorrateado por la cantidad),
            CREDIT_EXCEEDS_INVOICE (con las notas de crédito vigentes de la factura se superaría su total),
            UNSUPPORTED_CURRENCY, INVALID_ISSUE_DATE, EMISSION_POINT_DISABLED, INVALID_LINE,
            AMOUNT_TOO_LARGE, TAX_RATE_UNKNOWN, SEQUENCE_EXHAUSTED o DOCUMENT_XML_INVALID (el XML generado
            no pasó el esquema del SRI; no se consume secuencial).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /debit-notes:
