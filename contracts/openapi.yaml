            Repetirlo con el mismo cuerpo devuelve el mismo documento; con otro cuerpo responde
            409 IDEMPOTENCY_KEY_REUSED.
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueDebitNoteRequest' }
      responses:
        '202':
          description: Nota de débito aceptada y reservada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IssuedDocument' }
        '400':
          description: >
            Petición inválida. errorCode: VALIDATION_FAILED, MODIFIED_DOCUMENT_REQUIRED (no viene invoiceId
            ni modifiedDocument con customerId, o vienen los dos, o invoiceId con customerId),
            IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_KEY_INVALID o MALFORMED_REQUEST.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404':
          description: >
            El emisor, el punto de emisión, la factura (invoiceId) o el cliente no existen en la empresa.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '422':
          description: >
            Regla fiscal incumplida. errorCode: MODIFIED_DOCUMENT_NOT_INVOICE (invoiceId no es una
            factura), MODIFIED_INVOICE_OTHER_ISSUER (la factura es de otro emisor de la empresa),
            MODIFIED_INVOICE_NOT_AUTHORIZED (la factura no está autorizada), INVALID_MODIFIED_DOCUMENT_DATE
            (la factura es posterior a la nota), PAYMENT_METHOD_UNKNOWN, INVALID_PAYMENT_TERM (plazo sin
            unidad o al revés), PAYMENTS_MISMATCH (el pago no es
            igual al total), FINAL_CONSUMER_LIMIT_EXCEEDED (comprador consumidor final y total sobre el
            límite), TAX_RATE_UNKNOWN, INVALID_LINE (valor del motivo no positivo), AMOUNT_TOO_LARGE,
            UNSUPPORTED_CURRENCY, INVALID_ISSUE_DATE, EMISSION_POINT_DISABLED, SEQUENCE_EXHAUSTED o
            DOCUMENT_XML_INVALID (el XML generado no pasó el esquema del SRI; no se consume secuencial).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
